name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ASSAY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assay_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A fresh runner has an old pip, and pip-audit flags pip itself. Upgrade it first, so the audit
      # below is about the project's dependencies.
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,db,crypto,sso]"
      - run: ruff check .
      - run: pytest -q
      # FR-44: fail the build on a known-vulnerable dependency.
      - run: pip install pip-audit && pip-audit
  secrets:
    # FR-44: fail the build on a committed secret. On a push this scans the commits in that push, not the
    # whole history; every commit pushed so far has been scanned once. A full-history scan needs the CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
