[project]
name = "assay"
version = "0.1.0"
description = "Assay: fraud decision intelligence with the Adaptive Trust Calibration Engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pydantic>=2", "fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "httpx>=0.27", "pglast>=7"]
db = ["psycopg[binary]>=3.2"]
crypto = ["cryptography>=43"]  # per-tenant envelope encryption of model bundles (FR-41)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
